spring.application.name=backend
server.port=${PORT:8081}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/kampusX}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate validates schema; Flyway manages future changes
spring.jpa.hibernate.ddl-auto=validate

# Existing populated database ko baseline karo
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security=INFO

# JWT
jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}